name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration test (src/app/api/spots/route.test.ts) runs real
    # PostGIS queries, so it needs a real Postgres+PostGIS instance — this
    # service container, not the project-level Docker that was explicitly
    # skipped for Phase 13+. It only exists for the lifetime of this job.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spot_check_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spot_check_ci?schema=public
      SEED_ALLOW_RESET: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - run: npm run test
